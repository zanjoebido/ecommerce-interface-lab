<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRODUCT DETAIL VIEW</title>
    <link href="style.css" rel="Stylesheet">
</head>

<body>
  <main>
    <h1>Product Details</h1>
    <div class="table-responsive">
    <table class="spec-table">
      <thead>
        <tr>
          <th scope="col">Specification</th>
          <th scope="col">Detail</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Material</th>
          <td>Organic Cotton</td>
        </tr>

        <tr scope="row">Weight</tr>
        <td>0.5 lbs</td>
      </tbody>
    </table> 
    </div>

    <br>
  <form action="cart.html" method="get">
    <button type="submit">Add to Cart</button>
  </form>

  <br>
  <section class="reviews">
    <h2>Customer Reviews</h2>
      <article class="review">
        <span>⭐⭐⭐⭐</span>
        <h3>Great Quality!</h3>
        <blockquote>This Execeeded my expectations.</blockquote>
      </article>

      <article class="review">
        <span>⭐⭐⭐</span>
        <h3>Not that great, but not that bad!</h3>
        <blockquote>Recommended for those in budget.</blockquote>
      </article>  
  </section>
  </main>
</body>
</html>
