<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SHOPPING CART</title>
   <link href="style.css" rel="Stylesheet">
</head>

<body>
  
  <h1>Shopping Cart</h1>

  
  <ul>
    <article class="cart-container">
    <li>
      <img src="headphones.png" alt="Headphones" class="img">
      <h3>Premium Headphones</h3>
      <p class="price">199.00</p> 
    </li>
    </article>
  
    <article class="cart-container">
    <li>
      <img src="baby-oil.png" alt="Baby-Oil" class="img">
      <h3>Baby Oil</h3>
      <p class="price">70.99</p> 
    </li>
    </article>

    <article class="cart-container">
    <li>
      <img src="jacket.png" alt="Black Hoodie" class="img">
      <h3>Black Hoodie</h3>
      <p class="price">100.50</p>
    </li>
    </article>

    <article class="cart-container">
    <li>
      <img src="watermelon.png" alt="Watermelon" class="img">
      <h3>Watermelon</h3>
      <p class="price">15.99</p>
    </li>
    </article>

    <article class="cart-container">
    <li>
      <img src="basketball.png" alt="Basketball" class="img">
      <h3>Basketball</h3>
      <p class="price">229</p>
    </li>
  </ul>
  </article>

<br>
  Quantity <input type="number" value="1"> 

  <div>
    <p>Subtotal: <strong class="price">269.99</strong></p>
  </div>

  <a href="checkout.html"><button>Proceed to Checkout</button></a>

  

</body>
</html>
