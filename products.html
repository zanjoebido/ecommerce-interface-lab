<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRODUCT LISTING VIEW</title>
</head>

<body>

<main>
  <section>
    <article>
      <img src="hat.jpg" alt="hat">
      <p>$29.99</p>
      <a href="detail.html">View Details</a>
    </article>

  <aside>
    <h3>Filters</h3>
    <form>
        <h4>Category</h4>
  
        <label><input type="checkbox" value="Home & Garden"> Home & Garden</label>
        <label><input type="checkbox" value="Fashion"> Fashion</label>
  
        <h4>Price Range</h4>
        <label><input type="radio" name="price" value="low"> Under $50</label>
        <label><input type="radio" name="price" value="high"> Over $50</label>
      </form>
  </aside>

</main>
</body>
</html>
